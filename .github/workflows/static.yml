name: Deploy static website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: |
          mkdir -p public/src/styles
          if [ -f src/styles/main.scss ]; then
            npx sass --no-source-map src/styles/main.scss public/src/styles/main.css
          fi

      - name: Prepare website
        run: |
          cp index.html public/

          mkdir -p public/src

          if [ -d src/assets ]; then
            cp -r src/assets public/src/
          fi

          if [ -d src/js ]; then
            cp -r src/js public/src/
          fi

          if [ -d src/styles ]; then
            cp -r src/styles/. public/src/styles/
          fi

          if [ -d dist ]; then
            cp -r dist/. public/
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
