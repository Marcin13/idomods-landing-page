<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SOLLUX | Kolor i forma w nowym świetle</title>
  <meta name="description" content="Bestsellery SOLLUX. Polskie lampy z 5-letnią gwarancją, darmową dostawą od 299 zł i zwrotami do 100 dni.">
  <meta name="theme-color" content="#101011">
  <link rel="preload" href="src/assets/fonts/red-hat-display-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="dist/main.css">
  <script src="src/js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Przejdź do treści</a>

  <header class="site-header" data-header>
    <div class="site-header__inner">
      <a class="site-header__logo" href="#" aria-label="SOLLUX, strona główna">
        <img src="src/assets/logos/sollux-nav.svg" alt="" width="150" height="48">
      </a>

      <nav class="main-nav" id="main-nav" aria-label="Główna">
        <ul class="main-nav__list">
          <li><a href="#">Lampy <img src="src/assets/icons/angle-down.svg" alt="" width="16" height="16"></a></li>
          <li><a href="#">Kolory <img src="src/assets/icons/angle-down.svg" alt="" width="16" height="16"></a></li>
          <li><a href="#">Pomieszczenia <img src="src/assets/icons/angle-down.svg" alt="" width="16" height="16"></a></li>
          <li><a href="#">Nowości</a></li>
          <li><a href="#">Bestsellery</a></li>
          <li><a href="#">Promocje</a></li>
        </ul>
      </nav>

      <form class="search" role="search" action="#">
        <label class="visually-hidden" for="search">Czego szukasz?</label>
        <input id="search" type="search" name="q" placeholder="Czego szukasz?" autocomplete="off">
        <button type="submit" aria-label="Szukaj"><img src="src/assets/icons/search.svg" alt="" width="20" height="20"></button>
      </form>

      <div class="header-actions">
        <a class="header-actions__configurator" href="#">
          <img src="src/assets/icons/cube.svg" alt="" width="20" height="20">
          <span>Stwórz swoją lampę</span>
        </a>
        <a class="icon-button" href="#" aria-label="Moje konto"><img src="src/assets/icons/user.svg" alt="" width="24" height="24"></a>
        <a class="icon-button" href="#" aria-label="Koszyk"><img src="src/assets/icons/basket.svg" alt="" width="24" height="24"></a>
        <button class="icon-button menu-toggle" type="button" aria-controls="main-nav" aria-expanded="false" aria-label="Otwórz menu" data-menu-toggle>
          <span class="menu-toggle__bars" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="hero" data-hero aria-roledescription="karuzela" aria-labelledby="hero-title">
      <div class="hero__media">
        <div class="hero__stage">
          <div class="hero__slide is-active" data-slide role="group" aria-roledescription="slajd" aria-label="1 z 2">
            <picture>
              <source media="(max-width: 47.99rem)" srcset="src/assets/web/hero-plate-960.webp" type="image/webp">
              <img class="hero__image" src="src/assets/web/hero-plate-1920.webp" alt="" width="1920" height="1080" fetchpriority="high">
            </picture>
            <span class="hero__dusk" aria-hidden="true"></span>
            <button class="lamp lamp--terracotta" type="button" aria-pressed="false" aria-label="Włącz ceglastą lampę" data-lamp="ceglastą">
              <span class="lamp__float"><span class="lamp__beam"></span><img src="src/assets/web/lamp-terracotta.webp" alt="" width="403" height="382"><span class="lamp__halo"></span><span class="lamp__face"></span></span>
            </button>
            <button class="lamp lamp--cream" type="button" aria-pressed="false" aria-label="Włącz kremową lampę" data-lamp="kremową">
              <span class="lamp__float"><span class="lamp__beam"></span><img src="src/assets/web/lamp-cream.webp" alt="" width="361" height="374"><span class="lamp__halo"></span><span class="lamp__face"></span></span>
            </button>
            <button class="lamp lamp--olive" type="button" aria-pressed="false" aria-label="Włącz oliwkową lampę" data-lamp="oliwkową">
              <span class="lamp__float"><span class="lamp__beam"></span><img src="src/assets/web/lamp-olive.webp" alt="" width="442" height="417"><span class="lamp__halo"></span><span class="lamp__face"></span></span>
            </button>
          </div>
          <div class="hero__slide" data-slide role="group" aria-roledescription="slajd" aria-label="2 z 2" inert>
            <picture>
              <source media="(max-width: 47.99rem)" srcset="src/assets/web/hero-2-960.webp" type="image/webp">
              <img class="hero__image" src="src/assets/web/hero-2-1920.webp" alt="Wnętrze z granatową zabudową, jasną szafą i sufitowymi lampami SOLLUX" width="1920" height="1080">
            </picture>
          </div>
        </div>
      </div>
      <div class="hero__container">
        <p class="hero__eyebrow">Bestsellery SOLLUX</p>
        <h1 class="hero__title" id="hero-title">Kolor i forma <br>w nowym świetle</h1>
        <a class="button button--accent" href="#">Sprawdź bestsellery</a>
      </div>
      <button class="hero__arrow hero__arrow--prev" type="button" aria-label="Poprzedni slajd" data-prev><img src="src/assets/icons/arrow-left.svg" alt="" width="24" height="24"></button>
      <button class="hero__arrow hero__arrow--next" type="button" aria-label="Następny slajd" data-next><img src="src/assets/icons/arrow-right.svg" alt="" width="24" height="24"></button>
      <div class="hero__progress">
        <span class="is-active" data-segment><i></i></span>
        <span data-segment><i></i></span>
        <button class="hero__pause" type="button" aria-label="Zatrzymaj automatyczne przewijanie" data-pause hidden></button>
      </div>
      <p class="hero__rating"><strong>4.8</strong> <img src="src/assets/icons/star.svg" alt="na 5 gwiazdek" width="20" height="20"> <span>Uwielbiany przez klientów</span></p>
    </section>

  </main>

</body>
</html>
